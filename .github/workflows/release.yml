# Builds the Windows installers and publishes them as a GitHub Release.
# Runs when a version tag is pushed, e.g. `git tag v0.2.0 && git push origin v0.2.0`.
# The tag must match the version in src-tauri/tauri.conf.json, package.json and Cargo.toml.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Docket ${{ github.ref_name }}
          releaseBody: |
            Download **Docket_*_x64-setup.exe** (or the .msi) below and run it.
            Docket starts at login and lives in the tray; press Ctrl+Shift+Space to open the bar.
          releaseDraft: false
          prerelease: false
