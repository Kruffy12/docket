# Builds the Windows installers and publishes them as a GitHub Release named after
# the version in src-tauri/tauri.conf.json (e.g. v0.2.0); the tag is created on the
# commit that was built. Run it from Actions → Release → Run workflow (pick the
# branch), or push a matching tag. Bump the version first: a release that already
# exists gets its installers replaced.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Docket v__VERSION__
          releaseBody: |
            Download **Docket_*_x64-setup.exe** (or the .msi) below and run it.
            Docket starts at login and lives in the tray; press Ctrl+Shift+Space to open the bar.
          releaseDraft: false
          prerelease: false
